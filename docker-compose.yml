services:
  ghana-lotto-predictor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ghana-lotto-app
    ports:
      - "8501:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      # Point the mutable state at the mounted volume so a data refresh or a retrain
      # survives `docker compose down`.
      LOTTO_DATA_CSV: /data/ghana_lotto_history.csv
      LOTTO_ARTIFACT_DIR: /data/artifacts
      LOTTO_CACHE_DIR: /data/backtest_cache
      HOME: /data/.cache
    volumes:
      - lotto_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lotto_data:
