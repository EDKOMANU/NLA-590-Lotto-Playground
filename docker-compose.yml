version: '3.8'

services:
  ghana-lotto-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghana-lotto-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ghana_lotto_history.csv:/app/ghana_lotto_history.csv
      - ./artifacts:/app/artifacts
      - ./backtest_cache:/app/backtest_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
